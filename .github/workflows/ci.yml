name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: npm run check
      - run: npm test
      - run: go test ./cmd/fingerprint
